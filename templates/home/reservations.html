<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reservations</title>
        <style>
            body {
                font-family : Arial, sans-serif;
                margin : 0;
                padding : 0;
                background : #f8f9fa;
                color : #333;
            }

            header {
                background : #343a40;
                padding : 15px 20px;
                color : white;
            }

            header h1 {
                margin : 0;
                font-size : 24px;
            }

            nav {
                margin-top : 10px;
            }

            nav a {
                text-decoration : none;
                color : white;
                margin-right : 20px;
                font-weight : bold;
            }

            nav a:hover {
                color : #ffc107;
            }

            .container {
                max-width : 900px;
                margin : 40px auto;
                background : white;
                padding : 30px;
                border-radius : 8px;
                box-shadow : 0px 4px 10px rgba(0,0,0,0.1);
            }

            .container h2 {
                margin-top : 0;
                text-align : center;
                color : #007bff;
            }

            .form-group {
                margin-bottom : 20px;
            }

            label {
                display : block;
                margin-bottom : 6px;
                font-weight : bold;
            }

            input, select, textarea {
                width : 100%;
                padding : 10px;
                border : 1px solid #ccc;
                border-radius : 6px;
                font-size : 16px;
            }

            textarea {
                resize : vertical;
            }

            button {
                background : #007bff;
                color : white;
                padding : 12px 20px;
                border : none;
                border-radius : 6px;
                cursor : pointer;
                font-size : 16px;
                transition : background 0.3s;
            }

            button:hover {
                background : #0056b3;
            }

            .info {
                margin-top : 30px;
                padding : 20px;
                background : #e9ecef;
                border-left : 5px solid #007bff;
                border-radius : 6px;
            }
        </style>
    </head>
<body>
    <header>
        <h1>Restaurant Name</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/menu">Menu</a>
            <a href="/reservations">Reservations</a>
            <a href="/contact">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h2>Make a Reservations</h2>
        <form>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter Your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <label for="date">Reservation Date</label>
                <input type="date" id="date" required>
            </div>

            <div class="form-group">
                <label for="time">Reservation Time</label>
                <input type="time" id="time" required>
            </div>

            <div class="form-group">
                <label for="guests">Number of Guests</label>
                <select id="guests" required>
                    <option value="">Select</option>
                    <option value="1">1 Guest</option>
                    <option value="2">2 Guests</option>
                    <option value="3">3 Guests</option>
                    <option value="4">4 Guests</option>
                    <option value="5">5 Guests</option>
                    <option value="6+">6+ Guests</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">Special Requests</label>
                <textarea id="notes" rows="4" placeholder="Any special requests?"></textarea>
            </div>

            <button type="submit">Submit Reservations</button>
        </form>

        <div class="info">
            <h3>Reservations Policy</h3>
            <p>Please book at least 24 hours in advance. For groups larger than 6, we recommend calling us directly for better arrangements.</p>
        </div>
    </div>
</body>
</html>
