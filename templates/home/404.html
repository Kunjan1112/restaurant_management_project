<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Under Construction</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {
                margin : 0;
                font-family : 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color : #fef7e0;
                color : #333;
                display : flex;
                flex-direction : column;
                align-items : center;
                justify-content : center;
                height : 100vh;
                text-align : center;
            }

            h1 {
                font-size : 4rem;
                margin : 0 0 20px 0;
                color : #f39c12;
            }

            p {
                font-size : 1.5rem;
                margin : 10px 0 20px 0;
            }

            .launch-date {
                font-weight : bold;
                color : #e67e22;
            }

            a {
                display : initial-block;
                padding : 10px 20px;
                font-size : 1rem;
                background-color : #f39c12;
                color : #fff;
                text-decoration : none;
                border-radius : 5px;
                transition : background-color 0.3s;
            }

            a:hover {
                background-color : #d35400;
            }

            footer {
                background-color : #2d3436;
                text-align : center;
                padding : 15px 0;
                margin-top : 50px;
                font-size : 0.9rem;
                color : #dfe6e9;
            }
        </style>
    </head>
<body>
    <h1>Under Construction</h1>
    <p>We're working hard to launch our website soon!</p>
    <p class="launch-date">Expected Launch: December 2025</p>
    <a href="/">Go Back Home</a>

    <footer>
        <p>&copy; {{ now|date:"Y" }} {{ restaurant_name }}. All rights reserved.</p>
        <p style="margin:6px 0 0 0;">
            Hours: {{ restaurant_hours|default:"Mon-Fri: 11am-9pm, Sat-Sun: 10am-10am" }}
        </p>
    </footer>
</body>
</html>
