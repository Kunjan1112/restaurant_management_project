<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            font-family : 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color : #f8f9fa;
            color : #333;
        }

        h2 {
            font-weight : 700;
            color : #222;
            text-align : center;
            margin-bottom : 40px;
        }

        .card {
            border : none;
            border-radius : 15px;
            overflow : hidden;
            transition : transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform : translateY(-5px);
            box-shadow : 0px 8px 20px rgba(0,0,0,0.15);
        }

        .card-img-top {
            height : 280px;
            object-fit : cover;
        }

        .card-title {
            font-size : 1.25rem;
            font-weight : 600;
            color : #0d6efd;
        }

        .card-text {
            font-size : 0.95rem;
            color : #555;
        }

        .navbar-brand {
            font-weight : bold;
            font-size : 1.3rem;
        }

        footer {
            background : #212529;
            color : #bbb;
            font-size : 0.9rem;
        }

        footer p {
            margin : 0;
        }

    </style>

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">My Awesome Restaurant</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="mb-4">{{ page_title }}</h2>

        {% if chefs %}
            <div class="row g-4">
                {% for chef in chefs %}
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm">
                            <img src="{{ chef.image.url }}" class="card-img-top" alt="Photo of {{ chef.name }}">
                            <div class="card-body">
                                <h5 class="card-title">{{ chef.name }}</h5>
                                <p class="card-text">{{ chef.bio }}</p>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <p class="text-center text-muted">No chef information available yet.</p>
        {% endif %}
    </div>

    <!-- footer -->

    <footer class="text-center py-3 mt-5">
        <p>&copy; 2025 My Awesome Restaurant. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
