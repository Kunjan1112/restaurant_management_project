<!DOCTYPE html> 
<html lang="en"> 

<head>
    
    <meta charset="UTF-8">

    <title>Contact Us - Restaurant Name</title>

    <style>

        body {
            font-family : 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background : linear-gradient(135deg, #f6f6fb, #f1f1f9);
            padding : 40px;
            color : #333;
        }

        .container {
            max-width : 600px;
            margin : 0 auto;
            background : #fff;
            padding : 30px;
            border-radius : 15px;
            box-shadow : 0px 6px 18px rgba(0,0,0,0.12);
            transition : transform 0.3s ease;
        }

        h2 {
            margin-bottom : 20px;
            color : #6c5ce7;
            font-size : 28px;
        }

        p {
            font-size : 16px;
            color : #555;
            margin-bottom : 20px;
        }

        a.email-link {
            display : inline-block;
            padding : 12px 24px;
            background : #6c5ce7;
            color : white;
            font-weight : bold;
            border-radius : 10px;
            text-decoration : none;
            font-size : 16px;
            transition : background 0.3s ease, transform 0.2s ease;
        }

        a.email-link:hover {
            background : #574ae2;
            transform : scale(1.05);
        }

        footer {
            text-align : center;
            margin-top : 30px;
            color : #777;
            font-size : 14px;
        }

        @media (max-width : 600px) {
            body {
                padding : 20px;
            }
            .container {
                padding : 20px;
            }
        }

    </style>

</head>

<body>

    <div class="container">
        <h2>Contact Us</h2>
        <p>If you have any questions or reservations, feel free to reach out to us via email:</p>
        <a class="email-link" href="mailto:info@restaurant.com">Email Us</a>
    </div>


    <footer>
        Mon-Fri: 11am-9pm, Sat-Sun: 10am-10pm
    </footer>

</body>

</html>
