<!DOCTYPE html> 
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Access Denied - 403</title>
        <style>
            body {
                font-family : Arial, sans-serif;
                background-color : #f8d7da;
                color : #721c24;
                text-align : center;
                padding : 80px;
                margin : 0;
            }

            h1 {
                font-size : 60px;
                margin : 0;
            }

            h2 {
                margin-top : 10px;
                font-size : 28px;
            }

            p {
                margin : 20px 0;
                font-size : 18px;
            }

            a {
                display : inline-block;
                margin-top : 20px;
                padding : 12px 20px;
                background : #721c24;
                color : #fff;
                text-decoration : none;
                font-weight : bold;
                border-radius : 6px;
                transition : background 0.3s ease;
            }

            a:hover {
                background : #501414;
            }
        </style>
    </head>
<body>
    <h1>403</h1>
    <h2>Access Denied</h2>
    <p>Sorry, you don't have permission to view this page.<br>
        If you believe this is a mistake, please contact the site administrator.</p>
    <a href="/">Go Back Home</a>
</body>
</html>
