<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Order Confirmation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light d-flex justify-content-center align-items-center" style="height:100vh;">
    <div class="card shadow-lg p-5 text-center" style="max-width:500px;">
        <h1 class="text-success">Order Confirmed!</h1>

        <p class="mt-3">Thank you, <strong>{{ order.customer_name }}</strong>.</p>
        <p><strong>Order Number:</strong> #{{ order.id }}</p>
        <p><strong>Total Amount:</strong> ${{ order.total_amount }}</p>
        <p><em>Placed on: {{ order.created_at|date:"d M Y H:i" }}</em></p>

        <a href="/" class="btn btn-primary mt-4">Return to Home</a>

    </div>

</body>

</html>
