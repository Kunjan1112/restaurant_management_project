<!DOCTYPE html>
<html lang="en">

<head>

    <title>Your Cart</title>

</head>
<body>

    <h1>Your Shopping Cart</h1>
    {% if cart %}

        <ul>
            {% for id, item in cart_items %}
                <li>
                    {{ item.name }} (x{{ item.quantity }}) - ${{ item.price|floatformat:2 }}
                    <a href="{% url 'remove_from_cart' id %}">Remove</a>
                </li>
            {% endfor %}
        </ul>

        <h3>Total: ${{ total|floatformat:2 }}</h3>
    {% else %}
        <p>Your cart is empty.</p>
    {% endif %}

    <a href="{% url 'menu_list' %}">Back to Menu</a>

</body>
</html>
