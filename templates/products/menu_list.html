<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Menu - {{ restaurant_name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

        body {
            font-family : 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin : 0;
            padding : 0;
            background-color : #f9f9f9;
        }

        h1 {
            text-align : center;
            margin : 30px 0;
            color : #333;
        }


        .menu-item {
            background : #fff;
            border-radius : 12px;
            box-shadow : 0 2px 6px rgba(0,0,0,0.1);
            padding : 20px;
            transition : transform 0.3s ease;
        }

        .menu-item:hover {
            transform : translateY(-5px);
        }

        .menu-item h3 {
            font-size : 1.3rem;
            font-weight : 600;
            color : #444;
        }

        .menu-item p {
            margin : 8px 0;
            color : #666;
        }

        .price {
            color : #28a745;
            font-weight : bold;
            font-size : 1.2rem;
        }

        .menu-item img {
            width : 100%;
            height : 150px;
            object-fit : cover;
            border-radius : 8px;
            margin-bottom : 15px; 
        }

        @media (max-width: 576px) {
            .menu-item img {
                height : 120px;
            }
        }

    </style>
</head>
<body>
<div class="container">
    <h1>{{ restaurant_name }} - Menu</h1>

    <div class="menu-list-wrapper">
        <div class="row g-4">
            {% for item in menu_items %}
                <div class="col-md-4 col-sm-6">
                    <div class="menu-item text-center">
                        {% if item.image %}
                            <img src="{{ item.image.url }}" alt="{{ item.name }}">
                        {% endif %}
                        <h3>{{ item.name }}</h3>
                        <p>{{ item.description }}</p>
                        <p class="price">${{ item.price|floatformat:2  }}</p>

                        <!-- Add to cart / Order Button  -->
                        <form method="post" action="{% url 'add_to_order item.id %}">
                            {% csrf_token %}
                            <div class="input-group mb-2">
                                <input type="number" name="quantity" value="1" min="1" class="form-control">
                                <button type="submit" class="btn btn-success">Add to Order</button>
                            </div>
                        </form>
                    </div>
                </div>
            {% empty %}
                <div class="col-12">
                    <p class="text-center text-muted">No menu items available right now.</p>
                </div>
            {% endfor %}
        </div>
    </div>
</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
