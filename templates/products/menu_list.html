<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Menu - {{ restaurant_name }}</title>
    <style>

        body {
            font-family : Arial, sans-serif;
            margin : 20px;
            background-color : #f9f9f9;
        }

        h1 {
            text-align : center;
            margin-bottom : 40px;
            color : #333;
        }

        .menu-container {
            display : flex;
            flex-wrap : wrap;
            gap : 20px;
            justify-content : center;
        }

        .menu-item {
            background-color : #fff;
            border : 1px solid #ddd;
            border-radius : 10px;
            box-shadow : 0 2px 6px rgba(0,0,0,0.1);
            padding : 20px;
            width : 300px;
            transition : transform 0.2s;
        }

        .menu-item:hover {
            transform : translateY(-5px);
        }

        .menu-item h3 {
            margin-top : 0;
            color : #222;
        }

        .menu-item p {
            margin : 10px 0;
            color : #555;
        }

        .price {
            color : green;
            font-weight : bold;
            font-size : 1.1rem;
        }

        @media (max-width: 650px) {
            .menu-item {
                width : 100%;
            }
        }
    </style>
</head>
<body>
    <h1>Our Menu</h1>

    <div class="menu-container">
        {% for item in menu_items %}
        <div class="menu-item">
            <h3>{{ item.name }}</h3>
            <p>{{ item.description }}</p>
            <p class="price">${{ item.price }}</p>
        </div>
        {% empty %}
            <p>No Menu items available right now.</p>
        {% endfor %}
    </div>
</body>
</html>
