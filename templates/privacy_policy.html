<!DOCTYPE html>  
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Privacy Policy</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <style>
            body {
                background-color : #f9f9f9;
                font-family : Arial, sans-serif;
                line-height : 1.6;
            }

            .container {
                margin-top : 50px;
                margin-bottom : 50px;
                background : #fff;
                padding : 30px;
                border-radius : 12px;
                box-shadow : 0 4px 6px rgba(0,0,0,0.1);
            }

            h1 {
                color : #333;
            }

            .last-updated {
                margin-top : 20px;
                font-size : 0.9rem;
                color : #555;
            }
        </style>
    </head>
<body>

    <div class="container">

        <h1>Privacy Policy</h1>
        <p>This is our privacy policy. We value your trust and ensure that your personal information is kept safe and used only for restaurant services.</p>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer sit amet dictum purus, vel bibendum sapien.</p>
        <a href="{% url 'home' %}" class="btn btn-primary mt-3">Back to Home</a>

        <!-- Last Updated  -->
        <p class="last-updated" id="last-updated"></p>
        
    </div>

    <script>

        const lastModified = new Date(document.lastModified);
        const options = { year : 'numeric', month : 'long', day : 'numeric'};
        document.getElementById('last-updated').textContent = 
            `Last Updated: ${lastModified.toLocaleDateString(undefined, options)}`;
            
    </script>
</body>
</html>
